  server:
    port: 8081
  spring:
    rabbitmq:
      host: localhost
      port: 5672
      username: guest
      password: guest
      publisher-confirm-type: correlated  # 异步确认，消息到达交换机后回调
      publisher-returns: true              # 路由失败时回退消息
      listener:
        direct:
        simple:
          acknowledge-mode: manual # 手动确认
          prefetch: 1
          concurrency: 2
          max-concurrency: 8
    application:
      name: hmdp
    datasource:
      driver-class-name: com.mysql.jdbc.Driver
      url: jdbc:mysql://127.0.0.1:3306/dingping?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: 290390
    redis:
      host: 127.0.0.1
      port: 6379

      lettuce:
        pool:
          max-active: 30
          max-idle: 15
          min-idle: 5
          time-between-eviction-runs: 10s
    jackson:
      default-property-inclusion: non_null # JSON处理时忽略非空字段
  mybatis-plus:
    type-aliases-package: com.hmdp.entity # 别名扫描包
  logging:
    level:
      com.hmdp: debug
